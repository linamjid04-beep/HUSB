{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Groupe HUSB{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ meta_description|default:'Site institutionnel du Groupe HUSB, telecoms et fibre optique au Maroc.' }}{% endblock %}">
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Groupe HUSB">
    <meta property="og:title" content="{% block og_title %}Groupe HUSB{% endblock %}">
    <meta property="og:description" content="{{ meta_description|default:'Telecoms, fibre optique et materiel professionnel au Maroc.' }}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    {% include "includes/header.html" %}
    {% include "includes/messages.html" %}
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
</body>
</html>
